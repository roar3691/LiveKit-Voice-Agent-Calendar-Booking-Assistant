[project]
name = "livekit-calendar-agent"
version = "0.1.0"
description = "LiveKit voice calendar booking assistant"
requires-python = ">=3.10"
dependencies = [
  "livekit-agents[deepgram,openai,silero]>=1.0.0",
  "google-api-python-client>=2.170.0",
  "google-auth>=2.40.0",
  "python-dotenv>=1.1.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
