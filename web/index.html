<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveKit Calendar Voice Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Ambient background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
            animation: ambientShift 20s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes ambientShift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, 3%) rotate(3deg); }
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .status-dot.speaking {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            animation: pulse 1.2s ease-in-out infinite;
        }

        .status-dot.thinking {
            background: var(--warning);
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
            animation: pulse 0.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .status-text {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Transcript */
        .transcript-container {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            scroll-behavior: smooth;
        }

        .transcript-container::-webkit-scrollbar {
            width: 4px;
        }

        .transcript-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .transcript-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 0.85rem;
            gap: 8px;
        }

        .transcript-empty .icon {
            font-size: 2rem;
            opacity: 0.4;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            max-width: 85%;
            font-size: 0.88rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.2);
            margin-left: auto;
            text-align: right;
        }

        .msg.agent {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            margin-right: auto;
        }

        .msg .label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .msg.user .label { color: var(--accent); }
        .msg.agent .label { color: var(--success); }

        /* Audio Visualizer */
        .visualizer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            gap: 3px;
            margin-bottom: 16px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .visualizer-container.active { opacity: 1; }

        .visualizer-bar {
            width: 3px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
            transition: height 0.05s ease;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(20px);
        }

        .btn:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .btn:active { transform: translateY(0); }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn.primary:hover {
            background: #5558e6;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn.danger {
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        .btn.danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn .icon { font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>Calendar Voice Agent</h1>
            <p>Speak to schedule, reschedule, or manage your meetings</p>
        </div>

        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Disconnected</span>
        </div>

        <div class="transcript-container" id="transcript">
            <div class="transcript-empty" id="emptyState">
                <span class="icon">🎙️</span>
                <span>Connect and start speaking to your calendar assistant</span>
            </div>
        </div>

        <div class="visualizer-container" id="visualizer"></div>

        <div class="controls">
            <button class="btn primary" id="connectBtn" onclick="toggleConnect()">
                <span class="icon">⚡</span> Connect
            </button>
            <button class="btn" id="muteBtn" onclick="toggleMute()" disabled>
                <span class="icon">🎤</span> Mute
            </button>
            <button class="btn danger" id="clearBtn" onclick="clearTranscript()">
                <span class="icon">🗑️</span> Clear
            </button>
        </div>
    </div>

    <script type="module">
        // LiveKit Client SDK from CDN
        import {
            Room,
            RoomEvent,
            Track,
            DisconnectReason,
        } from 'https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs';

        const transcript = document.getElementById('transcript');
        const emptyState = document.getElementById('emptyState');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const connectBtn = document.getElementById('connectBtn');
        const muteBtn = document.getElementById('muteBtn');
        const visualizer = document.getElementById('visualizer');

        let room = null;
        let connected = false;
        let muted = false;
        let animFrame = null;

        // Create visualizer bars
        const NUM_BARS = 32;
        for (let i = 0; i < NUM_BARS; i++) {
            const bar = document.createElement('div');
            bar.className = 'visualizer-bar';
            visualizer.appendChild(bar);
        }
        const bars = visualizer.querySelectorAll('.visualizer-bar');

        function setStatus(text, state) {
            statusText.textContent = text;
            statusDot.className = 'status-dot';
            if (state) statusDot.classList.add(state);
        }

        function stripMarkdown(text) {
            return text
                .replace(/#{1,6}\s*/g, '')          // ## headers
                .replace(/\*\*(.*?)\*\*/g, '$1')    // **bold**
                .replace(/\*(.*?)\*/g, '$1')         // *italic*
                .replace(/_{1,2}(.*?)_{1,2}/g, '$1') // __underline__
                .replace(/~~(.*?)~~/g, '$1')         // ~~strikethrough~~
                .replace(/\[(.*?)\]\(.*?\)/g, '$1')  // [link](url)
                .replace(/^[\-\*]\s+/gm, '')         // - bullet points
                .replace(/^\d+\.\s+/gm, '')          // 1. numbered lists
                .replace(/\|/g, ',')                 // | table separators
                .replace(/^[\-=]{3,}$/gm, '')        // --- horizontal rules
                .replace(/`{1,3}(.*?)`{1,3}/g, '$1') // `code`
                .replace(/[✅📅🎉🗓️📝❌⚠️🔗📌💡🎯🔔]/g, '') // common emojis
                .replace(/\n{3,}/g, '\n\n')          // collapse excessive newlines
                .trim();
        }

        function addMessage(role, text) {
            if (!text || !text.trim()) return;
            emptyState.style.display = 'none';
            const cleanText = role === 'agent' ? stripMarkdown(text) : text;
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerHTML = `<div class="label">${role === 'user' ? 'You' : 'Agent'}</div>${cleanText}`;
            transcript.appendChild(div);
            transcript.scrollTop = transcript.scrollHeight;
        }

        function clearTranscript() {
            transcript.innerHTML = '';
            emptyState.style.display = '';
            transcript.appendChild(emptyState);
        }

        async function startVisualizer(stream) {
            const ctx = new AudioContext();
            const source = ctx.createMediaStreamSource(stream);
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 64;
            source.connect(analyser);
            const data = new Uint8Array(analyser.frequencyBinCount);
            visualizer.classList.add('active');

            function draw() {
                analyser.getByteFrequencyData(data);
                bars.forEach((bar, i) => {
                    const val = data[i] || 0;
                    bar.style.height = Math.max(4, (val / 255) * 36) + 'px';
                });
                animFrame = requestAnimationFrame(draw);
            }
            draw();
        }

        function stopVisualizer() {
            if (animFrame) cancelAnimationFrame(animFrame);
            visualizer.classList.remove('active');
            bars.forEach(b => b.style.height = '4px');
        }

        async function toggleConnect() {
            if (connected) {
                await disconnect();
            } else {
                await connect();
            }
        }

        async function connect() {
            try {
                setStatus('Connecting...', '');
                connectBtn.disabled = true;

                // Fetch config and token
                const [configRes, tokenRes] = await Promise.all([
                    fetch('/api/config'),
                    fetch(`/api/token?identity=web-user-${Date.now()}`),
                ]);
                const config = await configRes.json();
                const { token } = await tokenRes.json();

                room = new Room({
                    audioCaptureDefaults: { autoGainControl: true, noiseSuppression: true, echoCancellation: true },
                    adaptiveStream: true,
                });

                // Agent state events via data messages
                room.on(RoomEvent.TranscriptionReceived, (segments, participant) => {
                    for (const seg of segments) {
                        if (!seg.final) continue;
                        const role = participant?.isAgent ? 'agent' : 'user';
                        addMessage(role, seg.text);
                    }
                });

                room.on(RoomEvent.Disconnected, (reason) => {
                    handleDisconnect();
                });

                room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === Track.Kind.Audio) {
                        const el = track.attach();
                        document.body.appendChild(el);
                        // Some deployments do not set participant.isAgent reliably.
                        // If a remote audio track is subscribed, we are effectively connected.
                        setStatus('Agent audio connected — listening', 'connected');
                    }
                });

                const markAgentPresent = (participant) => {
                    // Agent workers often use identities without the substring "agent"; use SDK flag.
                    if (participant.isAgent) {
                        setStatus('Agent joined — listening', 'connected');
                    } else if (participant) {
                        // Fallback: show remote participant presence even if isAgent flag is unavailable.
                        setStatus('Remote participant joined — listening', 'connected');
                    }
                };

                room.on(RoomEvent.ParticipantConnected, (participant) => {
                    markAgentPresent(participant);
                });

                setStatus('Connected — waiting for agent...', 'connected');
                await room.connect(config.livekit_url, token);

                // Agent may already be in the room (dispatch completed before this handler ran).
                room.remoteParticipants.forEach((p) => markAgentPresent(p));

                await room.localParticipant.setMicrophoneEnabled(true);

                // Start mic visualizer
                const micTrack = room.localParticipant.getTrackPublication(Track.Source.Microphone);
                if (micTrack?.track?.mediaStream) {
                    startVisualizer(micTrack.track.mediaStream);
                }

                connected = true;
                muted = false;
                if (![...room.remoteParticipants.values()].some((p) => p.isAgent)) {
                    setStatus('Connected — waiting for agent...', 'connected');
                }
                connectBtn.innerHTML = '<span class="icon">⏹️</span> Disconnect';
                connectBtn.disabled = false;
                connectBtn.classList.remove('primary');
                connectBtn.classList.add('danger');
                muteBtn.disabled = false;
            } catch (err) {
                console.error('Connection failed:', err);
                setStatus(`Error: ${err.message}`, '');
                connectBtn.disabled = false;
            }
        }

        async function disconnect() {
            if (room) {
                await room.disconnect();
            }
            handleDisconnect();
        }

        function handleDisconnect() {
            connected = false;
            room = null;
            stopVisualizer();
            setStatus('Disconnected', '');
            connectBtn.innerHTML = '<span class="icon">⚡</span> Connect';
            connectBtn.disabled = false;
            connectBtn.classList.add('primary');
            connectBtn.classList.remove('danger');
            muteBtn.disabled = true;
            muteBtn.innerHTML = '<span class="icon">🎤</span> Mute';
        }

        async function toggleMute() {
            if (!room) return;
            muted = !muted;
            await room.localParticipant.setMicrophoneEnabled(!muted);
            muteBtn.innerHTML = muted
                ? '<span class="icon">🔇</span> Unmute'
                : '<span class="icon">🎤</span> Mute';
            if (muted) {
                stopVisualizer();
            } else {
                const micTrack = room.localParticipant.getTrackPublication(Track.Source.Microphone);
                if (micTrack?.track?.mediaStream) startVisualizer(micTrack.track.mediaStream);
            }
        }

        // Expose to global scope for onclick handlers
        window.toggleConnect = toggleConnect;
        window.toggleMute = toggleMute;
        window.clearTranscript = clearTranscript;
    </script>
</body>
</html>
